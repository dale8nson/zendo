[package]
name = "zendo-backend"
version = "0.1.0"
edition = "2021"

[features]
default = ["cpu"]
cpu = []
# Enable these features at compile time to try GPU EPs.
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
openvino = ["ort/openvino"]

[dependencies]
axum = { version = "0.7", features = ["ws", "macros", "json"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "5"
time = { version = "0.3", features = ["macros", "formatting"] }
dotenvy = "0.15"
num_cpus = "1.16"
fastrand = "2"
fxhash = "0.2"
tokenizers = "0.15"

# ONNX Runtime Rust bindings. Using dynamic loading path by default.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "tracing"] }
ndarray = { version = "0.16", features = ["rayon"] }

[build-dependencies]
vergen = { version = "8", default-features = false, features = ["build", "rustc", "si"] }
